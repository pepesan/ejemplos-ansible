---
# Bucles básicos: loop (recomendado) y su equivalente antiguo with_*.
- name: Bucles simples
  hosts: webservers
  gather_facts: false
  tasks:
    - name: loop sobre una lista
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop:
        - one
        - two

    - name: with_list (estilo antiguo, equivale al loop anterior)
      ansible.builtin.debug:
        msg: "{{ item }}"
      with_list:
        - one
        - two

    # Cada elemento es un diccionario con sus propias claves
    - name: loop sobre una lista de diccionarios
      ansible.builtin.debug:
        msg: "{{ item.nombre }} -> {{ item.dato }}"
      loop:
        - nombre: one
          dato: valor1
        - nombre: two
          dato: valor2

    - name: Using dict2items (recorrer un diccionario)
      ansible.builtin.debug:
        msg: "{{ item.key }} - {{ item.value }}"
      loop: "{{ tag_data | dict2items }}"
      vars:
        tag_data:
          Environment: dev
          Application: payment
...
