---
# Requires a real, already-installed "kasm" container to pull/remove images
# against — see kasm_group's molecule.yml for the same reasoning. Structure
# only; real verification happens in Fase A/B testing.
driver:
  name: docker
platforms:
  - name: kasm-docker-image-role-test
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: ""
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
