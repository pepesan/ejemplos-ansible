---
# Directory (control node) where generated passwords are persisted. Must
# match student_credentials_dir if you want this role to pick up the
# same "alumno" password already generated by that role.
kasm_credentials_dir: "{{ playbook_dir }}/.credenciales"
kasm_credentials_pass_prefix: "{{ kasm_credentials_dir }}/{{ inventory_hostname }}"

# Random per-host passwords, generated once and re-read on later runs.
# Override with -e kasm_admin_password=... / -e kasm_user_password=...
kasm_admin_password: "{{ lookup('password', kasm_credentials_pass_prefix + '-kasm-admin.pass length=20 chars=ascii_letters,digits') }}"
kasm_user_password: "{{ lookup('password', kasm_credentials_pass_prefix + '-kasm-user.pass length=20 chars=ascii_letters,digits') }}"

# Re-reads the same "alumno" password file student generates, only to
# dump it into the access CSV alongside the Kasm credentials.
kasm_credentials_alumno_password: "{{ lookup('password', kasm_credentials_pass_prefix + '-alumno.pass length=20 chars=ascii_letters,digits') }}"

kasm_credentials_admin_user: "admin@kasm.local"
kasm_credentials_user_user: "user@kasm.local"

# Course/cohort prefix so parallel deployments for different courses don't
# mix rows in the same CSV. Empty keeps the classic datos-acceso-<date>.csv
# filename.
kasm_proyecto_formativo: ""

# Exact name of the access CSV, derived from the inventory file used for the
# run: `-i inventory-mi-curso` -> datos-acceso-inventory-mi-curso.csv. No date,
# so every deployment from the same inventory lands in the same file and the
# name says which hosts are in it. Set it to "" to fall back to
# datos-acceso[-<proyecto>]-<date of the run>.csv (a new file each day).
kasm_credentials_csv_name: "datos-acceso-{{ inventory_file | default('inventario') | basename }}.csv"

kasm_credentials_csv_dir: "{{ playbook_dir }}"
