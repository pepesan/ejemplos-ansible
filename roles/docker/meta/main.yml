---
galaxy_info:
  role_name: docker
  description: Docker Engine plus the kernel tuning Kasm workloads need
  author: pepesan
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - all

dependencies:
  # First on purpose: it must run before geerlingguy.docker starts installing
  # packages through apt, so a broken IPv6 route cannot stall that install.
  - role: ipv4_preference
  - role: geerlingguy.docker
