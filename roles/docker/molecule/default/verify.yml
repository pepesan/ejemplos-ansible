---
- name: Verify
  hosts: all
  tasks:
    - name: Check the docker service is active
      ansible.builtin.systemd:
        name: docker
      register: docker_service
      check_mode: true

    - name: Assert docker is running
      ansible.builtin.assert:
        that:
          - docker_service.status.ActiveState == "active"

    - name: Check python3-docker is installed
      ansible.builtin.command: python3 -c "import docker"
      changed_when: false
