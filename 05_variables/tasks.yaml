---
- name: Install Databases
  hosts: ubuntu
  vars:
    repo_software_packages:
        - ca-certificates
        - python3-apt
    # Última versión estable de MariaDB (13.0, rolling). La última LTS es 12.3.
    mariadb_version: "13.0"
    key_url: "https://mariadb.org/mariadb_release_signing_key.asc"
    key_dest: /etc/apt/keyrings/mariadb-keyring.asc
    repo_uri: "https://dlm.mariadb.com/repo/mariadb-server/{{ mariadb_version }}/repo/ubuntu"
    linux_distribution: Ubuntu
    distribution_release: resolute
    mariadb_packages:
      - mariadb-server
      - mariadb-common
      - python3-pymysql
      - python3-openssl
  vars_files: # importación de variables desde fichero
    - vars.yaml

  tasks:
    - name: Install Mariadb Requirements for {{ linux_distribution }} {{ distribution_release }}
      ansible.builtin.package:
        name: "{{ repo_software_packages }}"
        state: present
        update_cache: true
    - name: Download MariaDB Repository Key for {{ linux_distribution }} {{ distribution_release }}
      ansible.builtin.get_url:
        url: "{{ key_url }}"
        dest: "{{ key_dest }}"
        mode: '0644'
    - name: Add MariaDB Repository for {{ linux_distribution }} {{ distribution_release }}
      ansible.builtin.deb822_repository:
        name: mariadb
        types: [deb]
        uris: "{{ repo_uri }}"
        suites: "{{ distribution_release }}"
        components: [main]
        architectures: [amd64]
        signed_by: "{{ key_dest }}"
        state: present
    - name: Update repositories
      ansible.builtin.apt:
        update_cache: true
    - name: Install Mariadb server for {{ linux_distribution }} {{ distribution_release }}
      apt:
        name: "{{ mariadb_packages }}"
        state: present
    - name: Servicio arrancado
      service:
        name: mariadb
        state: started
        enabled: true
    - name: Habilitar UFW
      ufw:
        state: enabled
        policy: deny
    - name: Habilitar el log
      ufw:
        logging: 'on'
    - name: abrir el firewall para 22
      ufw:
        rule: allow
        port: "22"
        proto: tcp
    - name: abrir el firewall para 3306
      ufw:
        rule: allow
        port: "3306"
        proto: tcp
    - name: Set MariaDB root password for 127.0.0.1, localhost
      ansible.mariadb.mariadb_user:
        name: root
        password: "{{ mysql_root_password }}"
        host: "{{ item }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mariadb_socket }}"
        state: present
      with_items:
        - 127.0.0.1
        - localhost
      #when: check_passwd_root.rc == 0
      #notify: Flush Priviliges
    - name: Remove all anonymous user
      ansible.mariadb.mariadb_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        name: 'test'
        host_all: yes
        state: absent
      #notify: Flush Priviliges
    - name: Flush Priviliges
      command: mysql -u root -p{{ mysql_root_password }} -e "FLUSH PRIVILEGES"
    - name: Create Database
      ansible.mariadb.mariadb_db:
        name: "{{ database_name }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        state: present

    - name: Create mysql User defined database
      ansible.mariadb.mariadb_user:
        name: "{{ database_user }}"
        password: "{{ database_password }}"
        priv: '{{ database_name }}.*:{{ mysql.privileges }}'
        login_user: root
        login_password: "{{ mysql_root_password }}"
        state: present
...
