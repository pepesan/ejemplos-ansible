---
# Válido para Debian y Ubuntu (os_family=Debian): todo se deduce de los facts.
repo_software_packages:
  - ca-certificates
  - python3-apt
  - python3-debian
mariadb_version: "13.0"
key_url: "https://mariadb.org/mariadb_release_signing_key.asc"
repo_uri: "https://dlm.mariadb.com/repo/mariadb-server/{{ mariadb_version }}/repo/{{ ansible_facts['distribution'] | lower }}"
key_dest: /etc/apt/keyrings/mariadb-keyring.asc
linux_distribution: "{{ ansible_facts['distribution'] }}"
distribution_release: "{{ ansible_facts['distribution_release'] }}"
mariadb_packages:
  - mariadb-server
  - mariadb-common
  - python3-pymysql
  - python3-openssl
mariadb_socket: /run/mysqld/mysqld.sock
mysql_root_password: test
database_name: test
database_user: test
database_password: test
mysql:
  privileges: "ALL"
