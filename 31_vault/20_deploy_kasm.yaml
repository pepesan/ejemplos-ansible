---
- name: Comprobar conectividad con los hosts del grupo ubuntu
  hosts: ubuntu
  gather_facts: no
  vars:
    kasm_dir: /opt/kasm
    kasm_files_dir: "{{ playbook_dir }}/files/kasm"
    # Imagen Kasm a desplegar. Opciones disponibles:
    #   pepesan/mi-ubuntu-resolute-kasm:1.0        -> Ubuntu 26.04 con IntelliJ, ZAP, Firefox
    #   pepesan/mi-ubuntu-resolute-kasm-go:1.0     -> Ubuntu 26.04 con entorno de desarrollo Go
    #   pepesan/mi-ubuntu-resolute-kasm-python-dind:1.3 -> Ubuntu 26.04 con PyCharm, MariaDB, DinD, lanzador docker-twitch (por defecto)
    #   pepesan/mi-ubuntu-noble-kasm:1.0           -> Ubuntu 24.04 con IntelliJ, ZAP, Firefox
    #   pepesan/mi-ubuntu-noble-kasm-go:1.0        -> Ubuntu 24.04 con entorno de desarrollo Go
    #   pepesan/mi-ubuntu-noble-kasm-python:1.0    -> Ubuntu 24.04 con entorno de desarrollo Python
    # Repositorio de imágenes personalizadas: https://github.com/pepesan/kasm-workspaces-images.git
    # Sobreescribir con: -e kasm_image=pepesan/mi-ubuntu-resolute-kasm-go
    kasm_image: "pepesan/mi-ubuntu-resolute-kasm-python-dind:1.3"
    kasm_version: "1.19.0"
    # Nombre y descripción del workspace (opcionales). Vacío = se deducen del nombre de la imagen.
    # Sobreescribir con: -e kasm_workspace_name="Mi workspace" -e kasm_workspace_desc="Mi descripción"
    kasm_workspace_name: ""
    kasm_workspace_desc: ""
    # Modo privilegiado del contenedor de sesión (necesario para las imágenes DinD).
    # Desactivar con: -e kasm_privileged=false
    kasm_privileged: true
    # Ruta en el HOST (el servidor Kasm, no dentro del contenedor) que Kasm monta
    # como home del usuario y persiste entre sesiones (perfil de escritorio,
    # documentos, configuración...). Debe contener {username} o {user_id} para
    # que cada usuario tenga su propio directorio; se añade {image_id} para que
    # no colisione entre distintas imágenes de workspace. Vacío = sin persistencia.
    # Desactivar con: -e kasm_persistent_profile_path=""
    kasm_persistent_profile_path: "/opt/kasm_profiles/{user_id}/{image_id}"
    # kasm_base_domain se define en group_vars/all/vars.yml (por defecto
    # "kasm.cursosdedesarrollo.com"). Sobreescribir con: -e kasm_base_domain=miotrodominio.com
    kasm_domain: "{{ node_name }}.{{ kasm_base_domain }}"
    # Contraseñas de Kasm: aleatorias por host, generadas una vez y reutilizadas
    # en ejecuciones posteriores (el lookup "password" las guarda en estos
    # ficheros y las relee si ya existen). Sobreescribir con:
    # -e kasm_admin_password=... / -e kasm_user_password=...
    credentials_dir: "{{ playbook_dir }}/.credenciales"
    kasm_admin_password: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-kasm-admin.pass length=20 chars=ascii_letters,digits') }}"
    kasm_user_password: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-kasm-user.pass length=20 chars=ascii_letters,digits') }}"
    # Misma ruta/patrón que usa 02_adduser_alumno.yaml para la contraseña de
    # "alumno" — si ese playbook ya se ejecutó antes, aquí se relee el mismo
    # valor (no se genera uno nuevo). Solo para volcarla al CSV de credenciales.
    alumno_password_value: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-alumno.pass length=20 chars=ascii_letters,digits') }}"
    kasm_credentials_csv: "{{ playbook_dir }}/credenciales_kasm.csv"
  tasks:
    # Prefiere IPv4 sobre IPv6 en la resolución de nombres del host (glibc,
    # getaddrinfo). Evita esperas de decenas de segundos en apt/curl/git cuando
    # un destino resuelve a IPv6 pero la ruta IPv6 del VPS no funciona. No
    # desactiva IPv6 ni afecta a los contenedores (cada uno tiene su gai.conf).
    - name: Preferir IPv4 sobre IPv6
      lineinfile:
        path: /etc/gai.conf
        regexp: '^\s*precedence\s+::ffff:0:0/96'
        line: 'precedence ::ffff:0:0/96  100'
        state: present
        create: true

    # En Ubuntu 23.10+/24.04+ el kernel restringe por defecto los user namespaces
    # sin privilegios vía AppArmor. Esto rompe bwrap (usado por el sandboxing de
    # iconos GTK/glycin y por Chrome/Electron dentro del contenedor de sesión),
    # provocando que XFCE entre en un bucle de crash y la sesión se quede en
    # pantalla negra. Se desactiva la restricción a nivel de host.
    - name: Desactivar restricción AppArmor de user namespaces sin privilegios (evita pantalla negra en XFCE)
      sysctl:
        name: kernel.apparmor_restrict_unprivileged_userns
        value: '0'
        sysctl_set: true
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-kasm-userns.conf
      ignore_errors: true

    - name: Crear directorio de Kasm
      file:
        path: "{{ kasm_dir }}"
        state: directory
        mode: '0755'

    - name: Copiar ficheros de Kasm
      copy:
        src: "{{ kasm_files_dir }}/"
        dest: "{{ kasm_dir }}/"
        mode: preserve
    ## Para evitar el fallo de la swap en la instalación de Kasm, vamos a crear un swapfile de 4GB si no existe
    - name: Comprobar si existe swapfile
      stat:
        path: /swapfile
      register: swapfile

    - name: Crear swapfile de 4GB
      command: fallocate -l 4G /swapfile
      when: not swapfile.stat.exists

    - name: Establecer permisos del swapfile
      file:
        path: /swapfile
        mode: '0600'
      when: not swapfile.stat.exists

    - name: Formatear swapfile
      command: mkswap /swapfile
      when: not swapfile.stat.exists

    - name: Activar swapfile
      command: swapon /swapfile
      when: not swapfile.stat.exists

    - name: Hacer swap permanente en fstab
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Lanzar contenedor Kasm con docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ kasm_dir }}"
        files:
          - compose.yaml
        state: present

    - name: Tip — seguir log de instalación en tiempo real
      debug:
        msg: "Para ver el progreso ejecuta en otra terminal: ssh root@{{ inventory_hostname }} 'tail -f /opt/kasm/data/opt/kasm_deploy.log'"

    - name: Ejecutar fix e instalación de Kasm
      community.docker.docker_container_exec:
        container: kasm
        command: bash /scripts/fix_and_install_kasm.sh
        env:
          KASM_ADMIN_PASSWORD: "{{ kasm_admin_password }}"
          KASM_USER_PASSWORD: "{{ kasm_user_password }}"
      register: install_output

    - name: Mostrar resultado de instalación
      debug:
        var: install_output.stdout

    - name: Configurar tiempos de workspace y deshabilitar pruning agresivo
      command: bash /opt/kasm/09_configure_session_limits.sh
      register: session_output

    - name: Mostrar resultado de configuración de sesión
      debug:
        var: session_output.stdout

    - name: Descargar imagen personalizada en el DinD de Kasm
      command: docker exec kasm docker pull {{ kasm_image }}
      async: 1800
      poll: 30

    - name: Etiquetar imagen con tag :1.0 en el DinD de Kasm
      command: docker exec kasm docker tag {{ kasm_image }} {{ kasm_image.split(':')[0] }}:1.0

    - name: Configurar workspace personalizado
      command: bash /opt/kasm/08_automatic_workspace_configure.sh
      environment:
        KASM_IMAGE: "{{ kasm_image }}"
        KASM_PRIVILEGED: "{{ kasm_privileged | lower }}"
        KASM_WORKSPACE_NAME: "{{ kasm_workspace_name }}"
        KASM_WORKSPACE_DESC: "{{ kasm_workspace_desc }}"
        KASM_PERSISTENT_PROFILE_PATH: "{{ kasm_persistent_profile_path }}"
      register: workspace_output

    - name: Mostrar resultado de configuración del workspace
      debug:
        var: workspace_output.stdout

    - name: Instalar bloqueo de impresión en nginx de kasm_proxy
      copy:
        src: "{{ kasm_files_dir }}/nginx/print_block.conf"
        dest: "{{ kasm_dir }}/data/opt/kasm/{{ kasm_version }}/conf/nginx/containers.d/print_block.conf"
        mode: '0644'

    - name: Recargar nginx de kasm_proxy
      command: docker exec kasm docker exec kasm_proxy nginx -s reload

    - name: Guardar credenciales de este nodo en datos-acceso-<fecha>.csv
      delegate_to: localhost
      become: false
      command: >
        python3 {{ playbook_dir }}/files/actualizar_credenciales_csv.py
        --csv-dir {{ playbook_dir }}
        --ip {{ inventory_hostname }}
        --kasm-url https://{{ kasm_domain }}
        --kasm-admin-user admin@kasm.local
        --kasm-user-user user@kasm.local
      environment:
        ALUMNO_PASSWORD: "{{ alumno_password_value }}"
        KASM_ADMIN_PASSWORD: "{{ kasm_admin_password }}"
        KASM_USER_PASSWORD: "{{ kasm_user_password }}"
      no_log: true

    - name: Indicar dónde quedaron las credenciales
      debug:
        msg: "Credenciales de acceso guardadas en {{ playbook_dir }}/datos-acceso-*.csv (fila IP {{ inventory_hostname }})"

# Entra a https://IP_SERVIDOR/ (o al dominio configurado) para acceder a Kasm.
# Las credenciales (alumno, admin@kasm.local, user@kasm.local) son aleatorias
# por host y quedan guardadas en datos-acceso-<fecha>.csv (ver tarea anterior).
