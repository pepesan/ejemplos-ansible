---
- name: Creación del usuario 'alumno' con contraseña segura
  hosts: ubuntu
  vars:
    # Contraseña aleatoria por host, generada una vez y reutilizada en
    # ejecuciones posteriores (el lookup "password" guarda el valor en este
    # fichero y lo relee si ya existe). Sobreescribir con: -e alumno_password_plain=...
    credentials_dir: "{{ playbook_dir }}/.credenciales"
    alumno_password_plain: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-alumno.pass length=20 chars=ascii_letters,digits') }}"
  tasks:
    - name: Crear grupo 'alumno'
      ansible.builtin.group:
        name: alumno
        state: present
    - name: Asegurar usuario alumno
      #no_log: true  # evita que la pass aparezca en logs
      ansible.builtin.user:
        name: alumno
        shell: /bin/bash
        state: present
        groups: alumno,docker
        append: yes
        create_home: yes
        password: "{{ alumno_password_plain | password_hash('sha512') }}"
        update_password: always
    - name: Añadir 'alumno' al grupo sudo
      ansible.builtin.user:
        name: alumno
        groups: sudo
        append: yes