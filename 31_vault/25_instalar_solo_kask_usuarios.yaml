---
# Instala Kasm Workspaces sin registrar ningún workspace (eso lo hace
# 23_crear_workspace.yaml después, por separado). Equivalente a la mitad de
# 20_deploy_kasm.yaml que no depende de ninguna imagen de workspace concreta:
# swapfile, docker compose up, fix_and_install_kasm.sh, límites de sesión,
# bloqueo de impresión en nginx, certificado HTTPS real de Let's Encrypt
# (mismos pasos que 22_configure_letsencrypt.yaml, reutilizados aquí), y
# contraseñas aleatorias + CSV de credenciales. Un solo playbook deja el
# servidor Kasm instalado y con HTTPS real, listo para crear workspaces.
#
# Requiere que el DNS de kasm_domain (node_name.kasm_base_domain) ya apunte a
# este host antes de ejecutar (si no, desactivar con -e kasm_letsencrypt_enabled=false).
#
# Orden de uso típico:
#   ansible-playbook -i inventory 01_docker_install.yaml --ask-vault-pass
#   ansible-playbook -i inventory 02_adduser_alumno.yaml --ask-vault-pass
#   ansible-playbook -i inventory 25_instalar_solo_kask_usuarios.yaml --ask-vault-pass
#   ansible-playbook -i inventory 23_crear_workspace.yaml --ask-vault-pass \
#     -e kasm_image=usuario/imagen:tag
- name: Instalar Kasm Workspaces (sin crear ningún workspace)
  hosts: ubuntu
  gather_facts: no
  vars:
    kasm_dir: /opt/kasm
    kasm_files_dir: "{{ playbook_dir }}/files/kasm"
    kasm_version: "1.19.0"
    # kasm_base_domain se define en group_vars/all/vars.yml (por defecto
    # "kasm.cursosdedesarrollo.com"). Sobreescribir con: -e kasm_base_domain=miotrodominio.com
    kasm_domain: "{{ node_name }}.{{ kasm_base_domain }}"
    # Contraseñas de Kasm: aleatorias por host, generadas una vez y reutilizadas
    # en ejecuciones posteriores (el lookup "password" las guarda en estos
    # ficheros y las relee si ya existen). Sobreescribir con:
    # -e kasm_admin_password=... / -e kasm_user_password=...
    credentials_dir: "{{ playbook_dir }}/.credenciales"
    kasm_admin_password: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-kasm-admin.pass length=20 chars=ascii_letters,digits') }}"
    kasm_user_password: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-kasm-user.pass length=20 chars=ascii_letters,digits') }}"
    # Misma ruta/patrón que usa 02_adduser_alumno.yaml para la contraseña de
    # "alumno" — si ese playbook ya se ejecutó antes, aquí se relee el mismo
    # valor (no se genera uno nuevo). Solo para volcarla al CSV de credenciales.
    alumno_password_value: "{{ lookup('password', credentials_dir + '/' + inventory_hostname + '-alumno.pass length=20 chars=ascii_letters,digits') }}"
    kasm_credentials_csv: "{{ playbook_dir }}/credenciales_kasm.csv"
    # Certificado HTTPS real (Let's Encrypt), igual que 22_configure_letsencrypt.yaml
    # (reutilizado aquí, no se toca ese fichero). Requiere que kasm_domain resuelva
    # ya a este host y que el puerto 80 esté libre para el challenge HTTP-01.
    # Desactivar con: -e kasm_letsencrypt_enabled=false
    kasm_letsencrypt_enabled: true
    letsencrypt_email: "pepesan@gmail.com"
  tasks:
    # En Ubuntu 23.10+/24.04+ el kernel restringe por defecto los user namespaces
    # sin privilegios vía AppArmor. Esto rompe bwrap (usado por el sandboxing de
    # iconos GTK/glycin y por Chrome/Electron dentro del contenedor de sesión),
    # provocando que XFCE entre en un bucle de crash y la sesión se quede en
    # pantalla negra. Se desactiva la restricción a nivel de host.
    - name: Desactivar restricción AppArmor de user namespaces sin privilegios (evita pantalla negra en XFCE)
      sysctl:
        name: kernel.apparmor_restrict_unprivileged_userns
        value: '0'
        sysctl_set: true
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-kasm-userns.conf
      ignore_errors: true

    - name: Crear directorio de Kasm
      file:
        path: "{{ kasm_dir }}"
        state: directory
        mode: '0755'

    - name: Copiar ficheros de Kasm
      copy:
        src: "{{ kasm_files_dir }}/"
        dest: "{{ kasm_dir }}/"
        mode: preserve
    ## Para evitar el fallo de la swap en la instalación de Kasm, vamos a crear un swapfile de 4GB si no existe
    - name: Comprobar si existe swapfile
      stat:
        path: /swapfile
      register: swapfile

    - name: Crear swapfile de 4GB
      command: fallocate -l 4G /swapfile
      when: not swapfile.stat.exists

    - name: Establecer permisos del swapfile
      file:
        path: /swapfile
        mode: '0600'
      when: not swapfile.stat.exists

    - name: Formatear swapfile
      command: mkswap /swapfile
      when: not swapfile.stat.exists

    - name: Activar swapfile
      command: swapon /swapfile
      when: not swapfile.stat.exists

    - name: Hacer swap permanente en fstab
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Lanzar contenedor Kasm con docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ kasm_dir }}"
        files:
          - compose.yaml
        state: present

    - name: Tip — seguir log de instalación en tiempo real
      debug:
        msg: "Para ver el progreso ejecuta en otra terminal: ssh root@{{ inventory_hostname }} 'tail -f /opt/kasm/data/opt/kasm_deploy.log'"

    - name: Ejecutar fix e instalación de Kasm
      community.docker.docker_container_exec:
        container: kasm
        command: bash /scripts/fix_and_install_kasm.sh
        env:
          KASM_ADMIN_PASSWORD: "{{ kasm_admin_password }}"
          KASM_USER_PASSWORD: "{{ kasm_user_password }}"
      register: install_output

    - name: Mostrar resultado de instalación
      debug:
        var: install_output.stdout

    - name: Configurar tiempos de workspace y deshabilitar pruning agresivo
      command: bash /opt/kasm/09_configure_session_limits.sh
      register: session_output

    - name: Mostrar resultado de configuración de sesión
      debug:
        var: session_output.stdout

    - name: Instalar bloqueo de impresión en nginx de kasm_proxy
      copy:
        src: "{{ kasm_files_dir }}/nginx/print_block.conf"
        dest: "{{ kasm_dir }}/data/opt/kasm/{{ kasm_version }}/conf/nginx/containers.d/print_block.conf"
        mode: '0644'

    - name: Recargar nginx de kasm_proxy
      command: docker exec kasm docker exec kasm_proxy nginx -s reload

    # A partir de aquí, mismos pasos que 22_configure_letsencrypt.yaml (reutilizados,
    # ese fichero no se toca). Requiere DNS de kasm_domain ya apuntando a este host.
    - name: Instalar certbot
      apt:
        name: certbot
        state: present
        update_cache: yes
      when: kasm_letsencrypt_enabled

    - name: Obtener certificado Let's Encrypt (standalone, puerto 80)
      command: >
        certbot certonly
        --standalone
        --non-interactive
        --agree-tos
        --email {{ letsencrypt_email }}
        -d {{ kasm_domain }}
      args:
        creates: /etc/letsencrypt/live/{{ kasm_domain }}/fullchain.pem
      when: kasm_letsencrypt_enabled

    - name: Encontrar directorio de certificados de Kasm
      find:
        paths: "{{ kasm_dir }}/data/opt/kasm"
        patterns: "kasm_nginx.crt"
        recurse: yes
      register: kasm_cert_found
      when: kasm_letsencrypt_enabled

    - name: Establecer ruta de certificados
      set_fact:
        kasm_cert_dir: "{{ kasm_cert_found.files[0].path | dirname }}"
      when: kasm_letsencrypt_enabled

    - name: Copiar certificado a Kasm
      copy:
        src: /etc/letsencrypt/live/{{ kasm_domain }}/fullchain.pem
        dest: "{{ kasm_cert_dir }}/kasm_nginx.crt"
        remote_src: yes
        mode: '0644'
      when: kasm_letsencrypt_enabled

    - name: Copiar clave privada a Kasm
      copy:
        src: /etc/letsencrypt/live/{{ kasm_domain }}/privkey.pem
        dest: "{{ kasm_cert_dir }}/kasm_nginx.key"
        remote_src: yes
        mode: '0600'
      when: kasm_letsencrypt_enabled

    - name: Reiniciar kasm_proxy para aplicar el certificado de Let's Encrypt
      command: docker exec kasm docker restart kasm_proxy
      when: kasm_letsencrypt_enabled

    - name: Copiar script de renovación automática
      copy:
        src: "{{ kasm_files_dir }}/10_letsencrypt_deploy_hook.sh"
        dest: /etc/letsencrypt/renewal-hooks/deploy/restart-kasm.sh
        mode: '0755'
      when: kasm_letsencrypt_enabled

    - name: Esperar a que kasm_proxy levante tras el reinicio
      wait_for:
        port: 443
        host: localhost
        delay: 5
        timeout: 30
      when: kasm_letsencrypt_enabled

    - name: Verificar que Kasm responde con el certificado de Let's Encrypt
      command: >
        curl -sk --max-time 10
        https://localhost
        -o /dev/null -w "%{http_code}"
      register: kasm_check
      retries: 6
      delay: 5
      until: kasm_check.stdout in ['200', '302']
      when: kasm_letsencrypt_enabled

    - name: Resultado de verificación HTTPS
      debug:
        msg: "Kasm accesible en https://{{ kasm_domain }} (HTTP {{ kasm_check.stdout }})"
      when: kasm_letsencrypt_enabled

    - name: Guardar credenciales de este nodo en datos-acceso-<fecha>.csv
      delegate_to: localhost
      become: false
      command: >
        python3 {{ playbook_dir }}/files/actualizar_credenciales_csv.py
        --csv-dir {{ playbook_dir }}
        --ip {{ inventory_hostname }}
        --kasm-url https://{{ kasm_domain }}
        --kasm-admin-user admin@kasm.local
        --kasm-user-user user@kasm.local
      environment:
        ALUMNO_PASSWORD: "{{ alumno_password_value }}"
        KASM_ADMIN_PASSWORD: "{{ kasm_admin_password }}"
        KASM_USER_PASSWORD: "{{ kasm_user_password }}"
      no_log: true

    - name: Localizar el fichero CSV de credenciales ya actualizado
      delegate_to: localhost
      become: false
      find:
        paths: "{{ playbook_dir }}"
        patterns: "datos-acceso-*.csv"
      register: credenciales_csv_encontrado

    - name: Indicar dónde quedaron las credenciales
      debug:
        msg: "Credenciales de acceso guardadas en {{ credenciales_csv_encontrado.files[0].path }} (fila IP {{ inventory_hostname }})"

# Kasm queda instalado y accesible en https://<kasm_domain>/ con certificado real de
# Let's Encrypt (o en https://IP_SERVIDOR/ con el autofirmado si kasm_letsencrypt_enabled=false
# o el DNS todavía no apunta aquí), pero SIN ningún workspace todavía. Para registrar el primero:
#   ansible-playbook -i inventory 23_crear_workspace.yaml --ask-vault-pass \
#     -e kasm_image=usuario/imagen:tag
