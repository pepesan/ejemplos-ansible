---
# Handlers de MariaDB, en su propio fichero. Se importan con import_tasks dentro de "handlers:".
# Los tres escuchan el mismo tema y se ejecutan en este orden.
- name: Validate mariadb config
  # --help --verbose lee la configuración y sale (rc != 0 si hay valores u opciones inválidos).
  # --user=mysql porque mariadbd se niega a ejecutarse como root.
  ansible.builtin.command: mariadbd --user=mysql --help --verbose
  listen: mariadb config changed
  changed_when: false
- name: Restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted
  listen: mariadb config changed
- name: Announce handlers ran
  ansible.builtin.debug:
    msg: "HANDLERS EJECUTADOS: MariaDB validado y reiniciado"
  listen: mariadb config changed
...
