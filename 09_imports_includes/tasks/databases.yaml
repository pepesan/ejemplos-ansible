---
- name: Deploy Databases
  hosts: databases
  vars_files:
    - ../vars/databases.yaml
  vars:
    mariadb_packages:
      - mariadb-server
      - mariadb-common
      - python3-pymysql
      - python3-openssl

  handlers:
    - name: Flush Priviliges
      ansible.builtin.command: mariadb -u root -p{{ mysql_root_password }} -e "FLUSH PRIVILEGES"
      changed_when: false

  tasks:
    # include_role: el rol se resuelve al EJECUTAR la tarea (dinámico)
    - name: Mensaje del día (rol incluido)
      ansible.builtin.include_role:
        name: motd
      vars:
        motd_message: "Servidor de BASES DE DATOS gestionado con Ansible"
        motd_file: /etc/motd-databases
    - name: Repositorio de MariaDB
      ansible.builtin.import_tasks: mariadb_repo.yaml
    - name: Install Mariadb server
      ansible.builtin.package:
        name: "{{ mariadb_packages }}"
        state: present
    - name: Servicio arrancado
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true
    # include_tasks: el fichero se evalúa al llegar a esta tarea (dinámico)
    - name: Firewall de los servidores de bases de datos
      ansible.builtin.include_tasks: firewall.yaml
      vars:
        firewall_ports: ["22", "3306"]
    - name: Set MariaDB root password for 127.0.0.1, localhost
      ansible.mariadb.mariadb_user:
        name: root
        password: "{{ mysql_root_password }}"
        host: "{{ item }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mariadb_socket }}"
        state: present
      with_items:
        - 127.0.0.1
        - localhost
      notify: Flush Priviliges
    - name: Create Database
      ansible.mariadb.mariadb_db:
        name: "{{ database_name }}"
        login_user: root
        login_password: "{{ mysql_root_password }}"
        state: present
    - name: Create mysql User defined database
      ansible.mariadb.mariadb_user:
        name: "{{ database_user }}"
        password: "{{ database_password }}"
        priv: '{{ database_name }}.*:{{ mysql.privileges }}'
        update_password: on_create
        login_user: root
        login_password: "{{ mysql_root_password }}"
        state: present
      notify: Flush Priviliges
...
