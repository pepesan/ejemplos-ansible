---
- name: Deploy webservers
  hosts: webservers
  vars_files: # importación de variables desde fichero
    - ../vars/webservers.yaml

  tasks:
    # import_role: el rol se resuelve ANTES de ejecutar (estático)
    - name: Mensaje del día (rol importado)
      ansible.builtin.import_role:
        name: motd
      vars:
        motd_message: "Servidor WEB gestionado con Ansible"
        motd_file: /etc/motd-webservers     # un fichero por play: en esta VM de pruebas web y bases de datos son el mismo host
    - name: Instalando nginx
      ansible.builtin.package:
        name: nginx
        state: present
        update_cache: true
    - name: Servicio arrancado
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    # import_tasks: las tareas del fichero se incorporan al play ANTES de ejecutar
    - name: Firewall de los servidores web
      ansible.builtin.import_tasks: firewall.yaml
      vars:
        firewall_ports: ["22", "80", "443"]
    - name: Copia el fichero index.html modificado con variables
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
...
