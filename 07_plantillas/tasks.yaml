---
# Plantillas Jinja2: página web con nginx + IP estática con netplan, ambas a partir de facts.
- name: Web server with templates
  hosts: webservers
  vars_files: # importación de variables desde fichero
    - vars.yaml

  tasks:
    - name: Instalando nginx
      ansible.builtin.package:
        name: nginx
        state: present
        update_cache: true
    - name: Servicio arrancado
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # Primero el puerto 22 y después habilitar UFW, para no quedarnos sin acceso SSH
    - name: Install UFW
      ansible.builtin.package:
        name: ufw
        state: present
    - name: abrir el firewall para 22
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
    - name: Habilitar UFW
      community.general.ufw:
        state: enabled
        policy: deny
    - name: Habilitar el log
      community.general.ufw:
        logging: 'on'
    - name: abrir el firewall para web (80 y 443)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["80", "443"]

    - name: Copia el fichero index.html modificado con variables
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

