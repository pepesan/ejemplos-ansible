# Envoltorio para AWX: retira el contenedor desplegado con docker run.
# AWX no ofrece en su lista los playbooks que están dentro de un directorio
# "tasks/", así que este fichero los importa desde ../tasks/. No hay lógica
# propia: se mantiene un único playbook (tasks/docker_undeploy.yaml), que sigue
# usándose igual desde otras herramientas.
- import_playbook: ../tasks/docker_undeploy.yaml
