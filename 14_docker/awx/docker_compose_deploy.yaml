# Envoltorio para AWX: despliega WordPress con Docker Compose.
# AWX no ofrece en su lista los playbooks que están dentro de un directorio
# "tasks/", así que este fichero los importa desde ../tasks/. No hay lógica
# propia: se mantiene un único playbook (tasks/docker_compose_deploy.yaml), que sigue
# usándose igual desde otras herramientas.
- import_playbook: ../tasks/docker_compose_deploy.yaml
