---
- name: Install Docker Engine from Docker's Ubuntu repository
  hosts: docker
  become: true
  vars:
    docker_ubuntu_codename: "{{ ansible_facts['distribution_release'] }}"
    docker_apt_keyring: /etc/apt/keyrings/docker-13-example.asc
    docker_apt_source_file: /etc/apt/sources.list.d/docker-13-example.sources
    docker_prerequisites: [ca-certificates, curl]
    docker_state_dir: /var/lib/ansible-docker-example
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  tasks:
    # assert corta el playbook pronto si el sistema no es el esperado (Ubuntu 26.04), antes de tocar nada.
    - name: Require supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - docker_ubuntu_codename == 'resolute'
        fail_msg: This example supports Ubuntu 26.04 Resolute only.

    # update_cache actualiza el índice de paquetes. changed_when: false porque refrescar no es un cambio real.
    - name: Refresh Ubuntu APT metadata
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    # Directorio con lo que había antes de instalar, para que docker_uninstall.yaml pueda deshacerlo con precisión.
    - name: Create state directory for the uninstall
      ansible.builtin.file:
        path: "{{ docker_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # dpkg-query solo consulta (changed_when/failed_when evitan marcarlo como cambio o error).
    # Con loop, register guarda una lista 'results' con un resultado por paquete.
    - name: Check which prerequisites are already installed
      ansible.builtin.command: dpkg-query -W -f='${Status}' {{ item }}
      loop: "{{ docker_prerequisites }}"
      register: prerequisites_before
      changed_when: false
      failed_when: false

    # Anota por paquete si ya estaba ('preexisting') o lo instala este ejemplo ('owned'). force: false:
    # solo la primera vez, para que una segunda ejecución no convierta un paquete nuestro en 'preexisting'.
    - name: Record ownership of each prerequisite
      ansible.builtin.copy:
        content: "{{ 'preexisting' if item.rc == 0 and ' installed' in item.stdout else 'owned' }}\n"
        dest: "{{ docker_state_dir }}/prereq-{{ item.item }}"
        force: false
        mode: '0600'
      loop: "{{ prerequisites_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ca-certificates y curl hacen falta para descargar la clave del repositorio por HTTPS.
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name: "{{ docker_prerequisites }}"
        state: present

    # Directorio estándar de APT para guardar claves de repositorios.
    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # get_url descarga la clave GPG con la que APT verificará los paquetes de Docker.
    - name: Install Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_keyring }}"
        mode: '0644'

    # Define el repositorio oficial de Docker en formato deb822 (.sources). Signed-By enlaza el repositorio con su clave.
    - name: Configure Docker APT repository
      ansible.builtin.copy:
        dest: "{{ docker_apt_source_file }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ docker_ubuntu_codename }}
          Components: stable
          Architectures: amd64
          Signed-By: {{ docker_apt_keyring }}

    # Hay que actualizar de nuevo el índice para que APT conozca los paquetes del repositorio recién añadido.
    - name: Refresh APT metadata for the Docker repository
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    # Instala la lista docker_packages (motor, CLI, containerd, buildx y compose) en una sola llamada a apt.
    - name: Install Docker Engine and supported plugins
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    # enabled: arranca al iniciar el sistema; state: started lo arranca ahora si no lo estaba.
    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    # Lo mismo para containerd, el runtime sobre el que funciona Docker.
    - name: Ensure containerd service is enabled and running
      ansible.builtin.service:
        name: containerd
        enabled: true
        state: started
