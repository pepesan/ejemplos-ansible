---
- name: Deploy docker container
  hosts: docker
  tasks:
    # source: pull descarga la imagen del registro.
    - name: Pull an image
      community.docker.docker_image:
        name: nginx:latest
        source: pull
    # Volumen persistente para los datos.
    - name: Create a volume
      community.docker.docker_volume:
        name: nginx-html-volume
        state: present
    # Crea y arranca el contenedor. restart: yes lo reinicia en cada ejecución; ports y volumes igual que en docker run -p y -v.
    - name: deploy nginx docker container with volume and ports
      community.docker.docker_container:
        image: nginx:latest
        name: nginx
        state: started
        restart: yes
        ports:
          - "80:80"
        volumes:
          - "nginx-html-volume:/var/www/html:rw"
    
...
