---
- hosts: docker
  tasks:
    # Necesario para que los módulos de Docker funcionen.
    - name: Install Docker Module for Python
      pip:
        name: docker
    # state: absent para y elimina el contenedor.
    - name: destroy nginx docker container
      community.docker.docker_container:
        name: nginx
        state: absent
    # Elimina el volumen (se pierden sus datos).
    - name: destroy a volume
      community.docker.docker_volume:
        name: nginx-html-volume
        state: absent
    # Elimina la imagen descargada.
    - name: destroy image nginx
      community.docker.docker_image:
        name: nginx:latest
        state: absent
    
...
