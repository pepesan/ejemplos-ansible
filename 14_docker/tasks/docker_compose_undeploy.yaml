---
- name: Undeploy WordPress stack with Docker Compose
  hosts: docker
  tasks:
    # Para los servicios definidos en el compose (equivalente a docker compose down).
    #  docker_compose_v2 usa el plugin 'docker compose';
    # el antiguo módulo docker_compose (docker-compose v1) ya no existe.
    - name: undeploy Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: /home/alumno/deploy
        files:
          - compose.yaml
        state: absent
    - name: delete Docker Compose files
      ansible.builtin.file:
        path: /home/alumno/deploy/{{ item }}
        state: absent
      loop:
        - compose.yaml
    # Directorio del servidor donde se dejará el compose.yaml.
    - name: Delete a directory
      ansible.builtin.file:
        path: /home/alumno/deploy
        state: absent